name: Latvia map data
on:
  schedule:
    - cron: '17 2 * * 1'      # every Monday early morning
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_pack.py', 'tools/climbs.py', '.github/workflows/latvia-pack.yml']
permissions:
  contents: write
concurrency: { group: latvia-pack, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build the pack
        run: pip install numpy pillow >/dev/null && python3 tools/build_pack.py
      - name: Publish
        run: |
          git config user.name "Artis"
          git config user.email "artisonck-spec@users.noreply.github.com"
          git add data/latvia.json data/latvia-meta.json
          git commit -m "Latvia map data $(date -u +%F)" || exit 0
          git pull --rebase -q origin main
          git push origin HEAD:main
