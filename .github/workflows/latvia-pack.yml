name: Latvia map data   # (and Estonia, Lithuania)
on:
  schedule:
    - cron: '17 2 * * 1'      # every Monday early morning
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_pack.py', 'tools/climbs.py', '.github/workflows/latvia-pack.yml']
permissions:
  contents: write
concurrency: { group: latvia-pack, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build the pack
        run: pip install numpy pillow osmium shapely pyshp pyproj >/dev/null && python3 tools/build_pack.py
      - name: Publish
        run: |
          git config user.name "Artis"
          git config user.email "artisonck-spec@users.noreply.github.com"
          git add data/*.json
          git commit -m "Baltic map data $(date -u +%F)" || exit 0
          # Another run may have published fresh data meanwhile: then keep that one instead of failing.
          if ! git pull --rebase -q origin main; then
            git rebase --abort
            echo "Main already has newer map data from another run; nothing to publish"; exit 0
          fi
          git push origin HEAD:main
