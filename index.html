<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Follow the ride · ATV Trails</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111213">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #111213; --card: #1a1b1d; --card-2: #202123; --line: rgba(255,255,255,.07);
    --ink: #f2f3f3; --ink-2: #a6a9ac; --ink-3: #6c7074;
    --hi: #2c3034; --lo: #1a1d20; --grad: linear-gradient(145deg, var(--hi), var(--lo)); --edge: rgba(255,255,255,.055);
    --brand: #2fd4b5; --on-brand: #062019; --teal-grad: linear-gradient(145deg, #4ee6c9, #22b89c);
    --green: #3dd68c; --amber: #ffb44d; --red: #ff6b6b;
    --font: 'Barlow', system-ui, Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.3 var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  #map { position: absolute; inset: 0; background: #17191b; }
  .day #map { background: #f1efeb; }
  .dark-tiles { filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(1.1) saturate(.4); }
  .leaflet-control-attribution { background: none !important; color: rgba(141,151,156,.85) !important; font-size: 9px; }
  .leaflet-control-attribution a { color: inherit !important; }
  .leaflet-bottom { bottom: calc(var(--panel-h, 260px) + 4px); }
  .leaflet-top { top: calc(var(--head-h, 90px) + 4px); }

  /* ---- Rider header: floating card ---- */
  #head { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 1000;
    display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; border-radius: 28px;
    background: var(--grad); box-shadow: 0 14px 40px rgba(0,0,0,.5), inset 0 1px 0 var(--edge); }
  .av { position: relative; width: 50px; height: 50px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--teal-grad); color: var(--on-brand); font: 700 20px var(--font); box-shadow: 0 0 20px rgba(47,212,181,.35); }
  .av::after { content: ''; position: absolute; right: 0; bottom: 0; width: 13px; height: 13px; border-radius: 50%; background: var(--ink-3); border: 3px solid #23262a; }
  .live .av::after { background: var(--green); }
  .stale .av::after { background: var(--amber); }
  .ended .av { background: #2a2c2f; color: var(--ink-2); box-shadow: none; }
  .ended .av::after { background: var(--red); }
  #who { font: 600 19px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stateTxt { font-size: 13.5px; color: var(--ink-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px; font: 700 12px var(--font); letter-spacing: .06em;
    padding: 7px 11px; border-radius: 14px; background: rgba(61,214,140,.12); color: var(--green); }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .live .badge i { animation: pulse 1.6s infinite; }
  .stale .badge { background: rgba(255,180,77,.12); color: var(--amber); }
  .ended .badge { background: rgba(255,107,107,.12); color: var(--red); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(61,214,140,.7); } 70%, 100% { box-shadow: 0 0 0 7px rgba(61,214,140,0); } }

  /* ---- Bottom panel: flat dashboard card ---- */
  #panel { position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 1000;
    background: var(--bg); border: 1px solid var(--line); border-radius: 30px; padding: 16px; box-shadow: 0 24px 70px rgba(0,0,0,.6); }
  .top-row { display: flex; gap: 12px; align-items: stretch; }
  /* speed dial */
  .dial { position: relative; width: 112px; height: 112px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--card); border: 1px solid var(--line); }
  .dial::before { content: ''; position: absolute; inset: 7px; border-radius: 50%;
    background: conic-gradient(from 220deg, #3ec5ff, #2fd4b5 calc(var(--sp, 0) * 280deg), rgba(255,255,255,.07) 0 280deg, transparent 0);
    -webkit-mask: radial-gradient(circle, transparent 42px, #000 43px); mask: radial-gradient(circle, transparent 42px, #000 43px);
    filter: drop-shadow(0 0 6px rgba(47,212,181,.45)); transition: --sp .6s; }
  .dial div { position: relative; text-align: center; }
  .dial b { display: block; font: 600 36px/1 var(--font); letter-spacing: -.02em; }
  .dial span { color: var(--ink-2); font-size: 12px; }
  .mini { flex: 1; display: grid; gap: 10px; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px 14px; min-width: 0; }
  .k { color: var(--ink-2); font-size: 13px; }
  .v { font: 500 26px/1.15 var(--font); letter-spacing: -.01em; }
  .v small { font: 400 14px var(--font); color: var(--ink-2); margin-left: 4px; }
  .bat { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .bat-ic { width: 34px; height: 17px; border: 2px solid var(--ink-3); border-radius: 5px; padding: 2px; position: relative; flex: none; }
  .bat-ic::after { content: ''; position: absolute; right: -5px; top: 4px; width: 3px; height: 5px; border-radius: 0 2px 2px 0; background: var(--ink-3); }
  .bat-ic i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--green); box-shadow: 0 0 8px rgba(61,214,140,.5); transition: width .4s; }
  .bat-ic.low i { background: var(--red); box-shadow: 0 0 8px rgba(255,107,107,.5); }
  #destRow { display: none; align-items: center; gap: 12px; margin-top: 10px; }
  .chip-ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; background: rgba(47,212,181,.1); color: var(--brand); }
  .chip-ic svg, .btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #destName { font: 600 17px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .btn { height: 56px; border-radius: 28px; border: 1px solid var(--line); background: var(--card-2); display: flex; align-items: center; justify-content: center; gap: 8px;
    font: 600 16px var(--font); text-decoration: none; color: var(--ink); cursor: pointer; }
  .btn.round { width: 56px; flex: none; padding: 0; color: var(--brand); }
  .btn.round.on { background: rgba(47,212,181,.12); border-color: rgba(47,212,181,.5); }
  .btn.primary { flex: 1; background: var(--brand); border: 0; color: var(--on-brand); font-weight: 700; box-shadow: 0 0 24px rgba(47,212,181,.28); }
  .btn:active { transform: scale(.98); }

  /* rider puck: same as the app */
  .me-icon { background: none; border: 0; }
  .me-wrap { position: relative; width: 56px; height: 56px; display: grid; place-items: center; }
  .me-wrap svg { position: relative; transition: transform .5s; filter: drop-shadow(0 3px 8px rgba(0,0,0,.45)) drop-shadow(0 0 10px rgba(47,212,181,.45)); }
  .me-pulse { position: absolute; inset: 6px; border-radius: 50%; background: rgba(47,212,181,.28); animation: mePulse 2.4s ease-out infinite; }
  @keyframes mePulse { 0% { transform: scale(.45); opacity: .9; } 100% { transform: scale(1.15); opacity: 0; } }
  .stale .me-pulse, .ended .me-pulse { display: none; }
  .ended .me-wrap svg, .stale .me-wrap svg { filter: grayscale(.8) drop-shadow(0 3px 8px rgba(0,0,0,.45)); }

  /* messages */
  #msg { position: absolute; inset: 0; z-index: 1100; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(10,11,12,.86); backdrop-filter: blur(6px); }
  #msg.on { display: flex; }
  #msg .box { max-width: 340px; width: 100%; text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: 26px; padding: 26px 20px; }
  #msg .chip-ic { margin: 0 auto 14px; width: 52px; height: 52px; }
  #msg h2 { margin: 0 0 6px; font: 600 22px var(--font); }
  #msg p { margin: 0; color: var(--ink-2); }
  @media (prefers-reduced-motion: reduce) { .me-pulse, .live .badge i { animation: none; } }
</style>
</head>
<body>
<div id="map"></div>

<div id="head">
  <div class="av" id="av">A</div>
  <div style="min-width:0;flex:1">
    <div id="who">Loading…</div>
    <div id="stateTxt">Connecting</div>
  </div>
  <span class="badge"><i></i><span id="badge">LIVE</span></span>
</div>

<div id="panel">
  <div class="top-row">
    <div class="dial" id="dial"><div><b id="spd">–</b><span>km/h</span></div></div>
    <div class="mini">
      <div class="card"><div class="k">Ridden so far</div><div class="v"><span id="dist">–</span><small>km</small></div></div>
      <div class="card bat"><div><div class="k">Phone battery</div><div class="v" id="bat">–</div></div><span class="bat-ic" id="batIc"><i></i></span></div>
    </div>
  </div>
  <div class="card" id="destRow">
    <span class="chip-ic"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg></span>
    <div style="min-width:0"><div class="k">Heading to</div><div id="destName"></div></div>
  </div>
  <div class="row">
    <button class="btn round on" id="center" aria-label="Follow the rider"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></svg></button>
    <a class="btn primary" id="dir" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2l8 8-8 8-8-8z"/><path d="M9.5 12V10h5M12.5 8l2 2-2 2"/></svg>Get directions</a>
  </div>
</div>

<div id="msg"><div class="box"><span class="chip-ic"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span><h2 id="msgT"></h2><p id="msgP"></p></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script>
(function () {
  const SUPA = 'https://umagrtiiygfnjiwsflea.supabase.co';
  const KEY = 'sb_publishable_zCRZtTY-Z3v-0VNVrDuVWg__zTXvOZM';
  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('t') || '';

  // Same Minimal map as the app: light by day, dark in the evening
  const h = new Date().getHours(), day = h >= 7 && h < 19;
  document.body.classList.toggle('day', day);
  const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([56.95, 24.6], 8);
  L.control.attribution({ prefix: false }).addTo(map);
  const which = day ? 'day' : 'night';
  let base = null;
  try {
    if (window.maplibregl && L.maplibreGL) {
      const style = window.__pvStyleFor ? window.__pvStyleFor(which) : new URL('styles/minimal-' + which + '.json', location.href).href;
      base = L.maplibreGL({ style, attribution: '© OpenStreetMap · OpenFreeMap', interactive: false }).addTo(map);
    }
  } catch (e) { base = null; }
  if (!base) L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: day ? '' : 'dark-tiles', attribution: '© OpenStreetMap' }).addTo(map);

  const glow = L.polyline([], { color: '#2fd4b5', weight: 14, opacity: .18, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(map);
  const track = L.polyline([], { color: '#2fd4b5', weight: 5, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(map);
  const acc = L.circle([0, 0], { radius: 1, color: '#2fd4b5', weight: 1, opacity: .4, fillOpacity: .08, interactive: false });
  const icon = L.divIcon({ className: 'me-icon', iconSize: [56, 56], iconAnchor: [28, 28],
    html: '<div class="me-wrap"><span class="me-pulse"></span><svg id="arrow" width="56" height="56" viewBox="0 0 56 56">' +
      '<defs><linearGradient id="meG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5df0d3"/><stop offset="1" stop-color="#1fb396"/></linearGradient></defs>' +
      '<circle cx="28" cy="28" r="20" fill="#1b1e21" stroke="#fff" stroke-width="2.5"/>' +
      '<path d="M28 14.5 L37.5 38 L28 32.5 L18.5 38 Z" fill="url(#meG)" stroke="url(#meG)" stroke-width="2" stroke-linejoin="round"/></svg></div>' });
  const rider = L.marker([0, 0], { icon, interactive: false, zIndexOffset: 1000 });
  let follow = true, first = true, last = null;
  const setFollow = (on) => { follow = on; $('center').classList.toggle('on', on); };
  map.on('dragstart', () => setFollow(false));
  $('center').onclick = () => { setFollow(true); if (last) map.setView([last.lat, last.lon], Math.max(map.getZoom(), 15)); };

  const sync = () => {
    document.documentElement.style.setProperty('--panel-h', ($('panel').offsetHeight + 10) + 'px');
    document.documentElement.style.setProperty('--head-h', ($('head').offsetHeight + 12) + 'px');
    map.invalidateSize();
  };
  addEventListener('resize', sync); sync();

  function km(pts) { let m = 0; for (let i = 1; i < pts.length; i++) m += map.distance(pts[i - 1], pts[i]); return m / 1000; }
  function ago(s) { return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' h ago'; }
  function message(t, p) { $('msgT').textContent = t; $('msgP').textContent = p; $('msg').classList.add('on'); }

  async function tick() {
    if (!token) { message('Link is incomplete', 'Ask the rider to send the link again.'); return; }
    let s = null;
    try {
      const r = await fetch(SUPA + '/rest/v1/rpc/get_share', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: token }) });
      s = r.ok ? await r.json() : null;
    } catch (e) { $('stateTxt').textContent = 'No connection · retrying'; return; }
    if (!s) { message('Link not found', 'It may have been mistyped, or the rider stopped sharing a while ago.'); return; }
    $('msg').classList.remove('on');
    const name = (s.rider || 'Rider').trim() || 'Rider';
    $('av').textContent = name[0].toUpperCase();
    const age = s.updated_at ? (Date.now() - new Date(s.updated_at)) / 1000 : null;
    const b = document.body;
    b.classList.remove('live', 'stale', 'ended');
    if (!s.active) { b.classList.add('ended'); $('who').textContent = name + ' finished'; $('badge').textContent = 'ENDED'; $('stateTxt').textContent = age != null ? 'Last seen ' + ago(age) : 'No position yet'; }
    else if (age == null) { b.classList.add('stale'); $('who').textContent = name + ' is sharing'; $('badge').textContent = 'WAITING'; $('stateTxt').textContent = 'Waiting for the first position'; }
    else if (age > 90) { b.classList.add('stale'); $('who').textContent = name + ' is riding'; $('badge').textContent = 'NO SIGNAL'; $('stateTxt').textContent = 'Seen ' + ago(age) + ' · may be out of signal'; }
    else { b.classList.add('live'); $('who').textContent = name + ' is riding'; $('badge').textContent = 'LIVE'; $('stateTxt').textContent = 'Updated ' + ago(age); }

    const pts = s.track || [];
    track.setLatLngs(pts); glow.setLatLngs(pts);
    $('dist').textContent = pts.length > 1 ? km(pts).toFixed(1) : '0.0';
    const moving = s.speed != null && s.active && age != null && age < 90;
    const kmh = moving ? Math.round(s.speed * 3.6) : null;
    $('spd').textContent = kmh == null ? '–' : kmh;
    $('dial').style.setProperty('--sp', kmh == null ? 0 : Math.min(1, kmh / 80).toFixed(3));
    $('bat').textContent = s.battery != null ? s.battery + '%' : '–';
    $('batIc').querySelector('i').style.width = (s.battery != null ? s.battery : 0) + '%';
    $('batIc').classList.toggle('low', s.battery != null && s.battery <= 20);
    $('destRow').style.display = s.dest ? 'flex' : 'none'; $('destName').textContent = s.dest || '';
    if (s.lat != null) {
      last = { lat: s.lat, lon: s.lon };
      rider.setLatLng([s.lat, s.lon]); if (!map.hasLayer(rider)) { rider.addTo(map); acc.addTo(map); }
      acc.setLatLng([s.lat, s.lon]).setRadius(s.accuracy || 1);
      const a = document.getElementById('arrow'); if (a && s.heading != null) a.style.transform = 'rotate(' + s.heading + 'deg)';
      $('dir').href = 'https://www.google.com/maps/dir/?api=1&destination=' + s.lat + ',' + s.lon;
      if (first) { map.setView([s.lat, s.lon], 15); first = false; } else if (follow) map.panTo([s.lat, s.lon]);
    }
    sync();
  }
  tick(); setInterval(tick, 5000);
})();
</script>
</body>
</html>
